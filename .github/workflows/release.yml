name: Publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, such as v2.7.0
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable semantic version tag.' >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require matching regression checks
        shell: bash
        run: |
          release_sha=$(git rev-parse HEAD)
          for attempt in $(seq 1 40); do
            conclusion=$(gh api "repos/$GH_REPO/actions/workflows/lint-and-test.yml/runs?head_sha=$release_sha&per_page=5" --jq '.workflow_runs[0].conclusion // empty')
            if [[ "$conclusion" == success ]]; then exit 0; fi
            if [[ -n "$conclusion" ]]; then echo "Checks did not pass: $conclusion" >&2; exit 1; fi
            echo "Waiting for checks on $release_sha ($attempt/40)..."
            sleep 15
          done
          echo 'No successful checks for the release commit.' >&2
          exit 1
      - name: Publish version notes
        shell: bash
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes" || { echo "Missing $notes" >&2; exit 1; }
          if gh release view "$RELEASE_TAG" --json url --jq .url; then
            echo 'Release already exists; leaving published content unchanged.'
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "VPSentinel $RELEASE_TAG" --notes-file "$notes" --latest
          fi
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
